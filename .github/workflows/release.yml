name: Build & Release All Platforms

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── WINDOWS DESKTOP (.exe) ────────────────────────────────
  build-windows:
    name: 🪟 Windows Desktop App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Build Electron .exe installer
        run: npx electron-builder --win --publish never
        env:
          NODE_ENV: production

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist_electron/*.exe

  # ─── ANDROID APK ───────────────────────────────────────────
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/Ownly-${VERSION}-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/Ownly-*.apk

  # ─── PUBLISH RELEASE ───────────────────────────────────────
  release:
    name: 🚀 Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-files/

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files/

      - name: List files to upload
        run: ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ownly ${{ github.ref_name }}"
          body: |
            ## 🎉 Ownly — ${{ github.ref_name }}

            ---

            ### 💻 Windows — Desktop App
            **⬇️ Download:** `Ownly-Setup-*.exe` (see Assets below ↓)
            1. Click the `.exe` file in **Assets** below
            2. Run the installer — it creates a desktop shortcut automatically
            3. Open **Ownly** and log in

            ---

            ### 🤖 Android — APK
            **⬇️ Download:** `Ownly-*-android.apk` (see Assets below ↓)
            1. Click the `.apk` file in **Assets** below
            2. Open it on your Android phone (allow "Install unknown apps" in Settings if asked)
            3. Open **Ownly** and log in

            ---

            ### 🍎 iPhone (iOS) — Add to Home Screen (Free)
            1. Open **Safari** on your iPhone → go to [topfile.onrender.com](https://topfile.onrender.com)
            2. Tap the **Share** button (📤)
            3. Tap **"Add to Home Screen"** → tap **Add**
            4. Ownly icon appears on your home screen — works like a real app!

            ---

            ### 🔑 Login
            Same email & password as the website. No account? [Sign up →](https://topfile.onrender.com)

            ---

            > **All downloads are in the Assets section right below ↓**
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
