name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required to create GitHub Releases and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (skip postinstall/build)
        run: npm ci --ignore-scripts

      - name: Build web app (Vite)
        run: npx tsc --noEmit --skipLibCheck; npx vite build
        env:
          NODE_ENV: production

      - name: Build Electron Windows installer (.exe)
        run: npx electron-builder --win --publish never
        env:
          NODE_ENV: production

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ownly Desktop ${{ github.ref_name }}"
          body: |
            ## 🎉 Ownly Desktop App — ${{ github.ref_name }}

            ### 📥 How to Download & Install
            1. Click **Ownly-Setup-*.exe** below
            2. Run it — it creates a desktop shortcut automatically
            3. Open **Ownly** and log in with your account

            ### 🔑 Login
            Use your existing Ownly account (same email & password as the website).
            No account yet? [Sign up here →](https://topfile.onrender.com)

            ### ✨ Features
            - Notes, Uploads, Links, Camera — all synced in real time
            - Works even when you switch devices
          files: dist_electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
