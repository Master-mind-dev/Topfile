services:
  - type: web
    name: ownly
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /api/test
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
