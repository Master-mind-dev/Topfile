<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#9f1239" />
    <meta name="description" content="OWNLY — Your personal knowledge base. Notes, files, web links, camera scanner and more — all in one place." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OWNLY" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        var p = window.location.pathname.toLowerCase();
        var h = window.location.hash.toLowerCase();
        var s = window.location.search.toLowerCase();
        if (p.startsWith('/admin') || h === '#admin' || s.indexOf('admin') !== -1) {
          var m = document.getElementById('app-manifest');
          if (m) m.href = '/admin-manifest.json';
          document.title = 'OWNLY Admin';
        }
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

    <title>OWNLY — Your Personal Knowledge Space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
